version: '3'

services:
  # OpenThread Border Router
  otbr:
    image: openthread/otbr:latest
    container_name: otbr
    network_mode: host
    privileged: true
    volumes:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - ./configs/otbr:/etc/otbr
      - otbr-data:/var/lib/otbr
    environment:
      - OTBR_INFRA_IF_NAME=eth0
      - OTBR_RADIO_URL=spinel+hdlc+uart:///dev/ttyUSB0
      - OTBR_WEB=1
      - OTBR_REST=1
      - REFERENCE_DEVICE=1
      - NAT64=1
      - DNS64=1
    ports:
      - "80:80"     # Web interface
      - "8080:8080" # REST API
    restart: unless-stopped
    depends_on:
      - prometheus-exporter

  # Prometheus Exporter for OTBR metrics
  prometheus-exporter:
    image: prom/node-exporter:latest
    container_name: prometheus-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      - prometheus-exporter

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus

  # Thread Network Visualizer
  thread-visualizer:
    image: openthread/web-visualizer:latest
    container_name: thread-visualizer
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  otbr-data:
  prometheus-data:
  grafana-data:
